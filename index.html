<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>יומן מחמצת</title>
<meta name="theme-color" content="#F6EFE3" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#1B1511" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="מחמצת">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Assistant:wght@400;600;700&family=Frank+Ruhl+Libre:wght@500;700;900&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F6EFE3; --bg2:#EFE4D2; --paper:#FFFDF9; --ink:#3A2A1E; --muted:#8A7766; --line:#EADFCC; --chip:#F3E9D8;
  --rye:#5B3A24; --on-rye:#FFF8EE; --crust:#A86B3C; --caramel:#D9A066; --dough:#F1E2C4; --flour:#FBF6EC;
  --levain:#D9A066; --plum:#A0442C; --ok:#6E7F4A; --glass:#FFFFFF;
  --shadow:0 1px 2px rgba(74,50,34,.06),0 10px 28px -14px rgba(74,50,34,.28);
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#1B1511; --bg2:#231B15; --paper:#271F19; --ink:#F3EADC; --muted:#B3A08C; --line:#3A2E25; --chip:#322820;
    --rye:#E2BE93; --on-rye:#24180F; --crust:#C98A55; --caramel:#E3AA6C; --dough:#E9D6B2; --flour:#2C231C;
    --levain:#E3AA6C; --plum:#E07A5E; --ok:#A7B97C; --glass:#2E2620;
    --shadow:0 1px 2px rgba(0,0,0,.3),0 10px 28px -14px rgba(0,0,0,.6);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#1B1511; --bg2:#231B15; --paper:#271F19; --ink:#F3EADC; --muted:#B3A08C; --line:#3A2E25; --chip:#322820;
  --rye:#E2BE93; --on-rye:#24180F; --crust:#C98A55; --caramel:#E3AA6C; --dough:#E9D6B2; --flour:#2C231C;
  --levain:#E3AA6C; --plum:#E07A5E; --ok:#A7B97C; --glass:#2E2620;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 10px 28px -14px rgba(0,0,0,.6);
  color-scheme:dark;
}
html{scroll-padding-top:env(safe-area-inset-top,0px);background:var(--bg)}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;color:var(--ink);font-family:'Assistant',system-ui,-apple-system,'Segoe UI',Arial,sans-serif;font-size:16px;line-height:1.55;-webkit-text-size-adjust:100%;
  background:radial-gradient(1200px 500px at 100% -10%,var(--flour),transparent 60%),radial-gradient(900px 600px at -10% 110%,var(--bg2),transparent 60%),var(--bg);background-attachment:fixed;min-height:100%}
.app{max-width:560px;margin:0 auto;padding:10px 16px 130px}
header.top{display:flex;align-items:center;justify-content:space-between;padding:10px 2px 18px;gap:12px}
.brandwrap{display:flex;align-items:center;gap:12px}
.logo{width:48px;height:48px;border-radius:16px;background:var(--paper);box-shadow:var(--shadow);display:grid;place-items:center;flex:none}
.logo svg{width:34px;height:34px}
.hello{font-size:13px;color:var(--muted);font-weight:600}
.brand{font-family:'Frank Ruhl Libre',Georgia,serif;font-weight:900;font-size:27px;line-height:1.05;letter-spacing:-.01em;color:var(--rye)}
.sync{font-size:12px;color:var(--muted);white-space:nowrap;background:var(--paper);padding:5px 10px;border-radius:99px;box-shadow:var(--shadow)}
h2{font-family:'Frank Ruhl Libre',Georgia,serif;font-weight:700;font-size:21px;margin:28px 2px 12px;line-height:1.2;color:var(--rye);display:flex;align-items:center;gap:10px}
h2::after{content:'';flex:1;height:1px;background:linear-gradient(to left,var(--line),transparent)}
h3{font-family:'Frank Ruhl Libre',Georgia,serif;font-weight:700;font-size:19px;margin:0 0 6px;line-height:1.25;color:var(--rye)}
h4{font-size:16px;margin:12px 0 4px}
p{margin:0 0 8px}
a{color:var(--crust)}
.panel{background:var(--paper);border:1px solid var(--line);border-radius:22px;padding:18px;margin-bottom:14px;box-shadow:var(--shadow)}
.panel.flat{background:transparent;box-shadow:none;border-color:transparent}
.panel.warm{background:linear-gradient(160deg,var(--paper) 30%,var(--flour));}
.sub{background:var(--bg);border:1px solid var(--line);border-radius:18px;padding:14px}
.muted{color:var(--muted)}
.small{font-size:14px}
.tiny{font-size:12.5px}
.big{font-family:'Frank Ruhl Libre',Georgia,serif;font-size:46px;font-weight:700;font-variant-numeric:tabular-nums;line-height:1;letter-spacing:-.02em;color:var(--rye)}
.mid{font-family:'Frank Ruhl Libre',Georgia,serif;font-size:26px;font-weight:700;font-variant-numeric:tabular-nums;line-height:1.1;color:var(--rye)}
.num{font-variant-numeric:tabular-nums}
.hero{display:grid;grid-template-columns:128px 1fr;gap:18px;align-items:center}
.hero .jarwrap{width:128px}
.jar{width:100%;height:auto;display:block;filter:drop-shadow(0 10px 14px rgba(74,50,34,.18))}
.state{display:inline-block;font-weight:700;font-size:13px;padding:4px 12px;border-radius:99px;background:var(--chip);color:var(--ink);margin-bottom:10px;letter-spacing:.01em}
.state.peak{background:var(--caramel);color:#2E1F14}
.state.over{background:var(--plum);color:#fff}
.state.ok{background:var(--ok);color:#fff}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.row.sp{justify-content:space-between}
.btn{appearance:none;border:1px solid var(--line);background:var(--paper);color:var(--ink);font:inherit;font-weight:700;padding:11px 18px;border-radius:14px;cursor:pointer;min-height:46px;line-height:1.2;text-decoration:none;display:inline-flex;align-items:center;justify-content:center;gap:6px;transition:transform .12s ease,box-shadow .12s ease}
.btn:active{transform:scale(.97)}
.btn.primary{background:var(--rye);border-color:var(--rye);color:var(--on-rye);box-shadow:0 6px 16px -8px rgba(91,58,36,.7)}
.btn.accent{background:var(--caramel);border-color:var(--caramel);color:#2E1F14;box-shadow:0 6px 16px -8px rgba(168,107,60,.7)}
.btn.ghost{background:transparent}
.btn.danger{color:var(--plum)}
.btn.small{padding:7px 14px;min-height:38px;font-size:14px;border-radius:12px}
.btn.wide{width:100%}
.btn[disabled]{opacity:.5;cursor:default}
.link{background:none;border:0;padding:0;font:inherit;color:var(--crust);font-weight:700;cursor:pointer;text-decoration:underline;text-underline-offset:3px}
:focus-visible{outline:3px solid var(--caramel);outline-offset:2px}
label.f{display:block;font-size:13px;color:var(--muted);font-weight:600}
input,select,textarea{font:inherit;color:var(--ink);background:var(--flour);border:1px solid var(--line);border-radius:12px;padding:10px 12px;width:100%;margin-top:5px;min-height:44px}
input:focus,select:focus,textarea:focus{border-color:var(--caramel);outline:none;box-shadow:0 0 0 3px color-mix(in srgb,var(--caramel) 30%,transparent)}
textarea{min-height:72px;resize:vertical}
input[type=number]{direction:ltr;text-align:right}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.g3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.stack>*+*{margin-top:12px}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:var(--paper);color:var(--ink);border-radius:99px;padding:7px 14px;font:inherit;font-size:14px;cursor:pointer;min-height:38px}
.chip[aria-pressed="true"]{background:var(--rye);border-color:var(--rye);color:var(--on-rye)}
.note{background:var(--paper);border:1px solid var(--line);border-inline-start:4px solid var(--caramel);padding:11px 14px;border-radius:14px;margin:8px 0;box-shadow:var(--shadow)}
.note.bad{border-inline-start-color:var(--plum)}
.note.good{border-inline-start-color:var(--ok)}
.warn{color:var(--plum);font-weight:600}
.late{color:var(--plum);font-weight:700}
.list{list-style:none;margin:0;padding:0}
.list li{display:flex;justify-content:space-between;gap:10px;padding:11px 0;border-bottom:1px dashed var(--line);align-items:flex-start}
.list li:last-child{border-bottom:0}
.list .x{background:none;border:0;color:var(--muted);cursor:pointer;font-size:18px;padding:0 6px;min-height:32px}
.card{display:flex;gap:14px;align-items:center;width:100%;text-align:start;background:var(--paper);border:1px solid var(--line);border-radius:20px;padding:12px;margin-bottom:12px;font:inherit;color:inherit;cursor:pointer;box-shadow:var(--shadow);transition:transform .15s ease}
.card:active{transform:scale(.985)}
.card .art{width:88px;height:64px;flex:none;border-radius:14px;background:var(--flour);display:grid;place-items:center;overflow:hidden}
.card .art svg{width:84px;height:56px}
.card .meta{flex:1;min-width:0}
.card .t{font-family:'Frank Ruhl Libre',Georgia,serif;font-weight:700;font-size:19px;color:var(--rye)}
.stars{color:var(--caramel);letter-spacing:1px}
.clocks{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:12px 0 10px}
.clock{background:var(--paper);border:1px solid var(--line);border-radius:18px;padding:12px 8px;text-align:center;box-shadow:var(--shadow)}
.clock b{display:block;font-family:'Frank Ruhl Libre',Georgia,serif;font-size:21px;font-variant-numeric:tabular-nums;direction:ltr;color:var(--rye)}
.clock span{font-size:12px;color:var(--muted)}
.steps{list-style:none;padding:0;margin:4px 0 0}
.step{position:relative;padding:0 36px 18px 0}
.step::before{content:'';position:absolute;right:12px;top:28px;bottom:2px;width:2px;background:repeating-linear-gradient(to bottom,var(--line) 0 5px,transparent 5px 9px)}
.step.done::before{background:var(--crust);opacity:.5}
.step:last-child::before{display:none}
.dot{position:absolute;right:0;top:2px;width:26px;height:26px;border-radius:50%;border:2px solid var(--line);background:var(--paper);display:grid;place-items:center;color:var(--on-rye);font-size:13px;font-weight:700}
.step.done .dot{background:var(--crust);border-color:var(--crust)}
.step.cur .dot{background:var(--caramel);border-color:var(--caramel);box-shadow:0 0 0 5px color-mix(in srgb,var(--caramel) 25%,transparent)}
.step .head{display:flex;justify-content:space-between;gap:8px;align-items:baseline;padding-top:3px}
.step .title{font-weight:700}
.step.cur .title{font-family:'Frank Ruhl Libre',Georgia,serif;font-size:19px;color:var(--rye)}
.step.done .title{color:var(--muted)}
.step .body{background:var(--flour);border:1px solid var(--line);border-radius:18px;padding:16px;margin-top:10px}
.ringrow{display:flex;gap:16px;align-items:center}
.ring{width:118px;height:118px;flex:none}
.bar{height:12px;border-radius:99px;background:var(--chip);overflow:hidden;position:relative}
.bar i{display:block;height:100%;background:linear-gradient(to left,var(--caramel),var(--crust));border-radius:99px}
.bar.over i{background:var(--plum)}
.bowl{width:100%;max-width:260px;height:auto;display:block;margin:4px auto 6px}
.tbl{overflow-x:auto;margin:8px 0}
table{border-collapse:collapse;width:100%;font-size:14px}
th,td{text-align:start;padding:8px;border-bottom:1px dashed var(--line);vertical-align:top}
th{color:var(--muted);font-weight:600;font-size:13px}
details{background:var(--paper);border:1px solid var(--line);border-radius:18px;margin-bottom:10px;box-shadow:var(--shadow)}
details>summary{cursor:pointer;padding:14px 16px;font-weight:700;list-style:none;display:flex;justify-content:space-between;align-items:center;gap:10px}
details>summary::-webkit-details-marker{display:none}
details>summary::after{content:'';width:9px;height:9px;border-inline-start:2px solid var(--muted);border-bottom:2px solid var(--muted);transform:rotate(-45deg);transition:transform .2s;flex:none;margin-inline-start:auto}
details[open]>summary::after{transform:rotate(135deg)}
details .ico{width:34px;height:34px;border-radius:11px;background:var(--flour);display:grid;place-items:center;flex:none;font-size:18px}
details .in{padding:0 16px 16px}
.ing{list-style:none;padding:0;margin:0}
.ing li{display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px dashed var(--line)}
.ing li:last-child{border-bottom:0}
.ing li b{font-variant-numeric:tabular-nums;direction:ltr;color:var(--rye)}
.ai{font-size:15px}
.ai ul{padding-inline-start:20px;margin:4px 0 10px}
.chart{width:100%;height:auto;display:block}
.rhero{border-radius:26px;overflow:hidden;background:linear-gradient(170deg,var(--flour),var(--dough));margin:10px 0 14px;box-shadow:var(--shadow);display:grid;place-items:center;padding:18px}
.rhero svg{width:78%;max-width:320px;height:auto}
.stat{background:var(--paper);border:1px solid var(--line);border-radius:18px;padding:14px 8px;text-align:center;box-shadow:var(--shadow)}
nav.tabs{position:fixed;bottom:0;left:0;right:0;padding:0 12px calc(10px + env(safe-area-inset-bottom,0px));z-index:20;pointer-events:none}
nav.tabs .in{max-width:540px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr);background:color-mix(in srgb,var(--paper) 92%,transparent);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border:1px solid var(--line);border-radius:24px;box-shadow:0 12px 30px -12px rgba(74,50,34,.35);padding:6px;pointer-events:auto}
nav.tabs button{background:none;border:0;font:inherit;font-size:11.5px;color:var(--muted);padding:6px 0 5px;display:flex;flex-direction:column;align-items:center;gap:2px;cursor:pointer;min-height:54px;border-radius:18px;transition:background .15s}
nav.tabs button[aria-current="page"]{color:var(--rye);font-weight:700;background:var(--chip)}
nav.tabs svg{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
#sheet{position:fixed;inset:0;z-index:50}
#sheet[hidden]{display:none}
.sheet-bg{position:absolute;inset:0;background:rgba(40,26,16,.45);backdrop-filter:blur(2px)}
.sheet{position:absolute;bottom:0;left:0;right:0;max-width:560px;margin:0 auto;background:var(--paper);border-radius:28px 28px 0 0;padding:14px 18px calc(22px + env(safe-area-inset-bottom,0px));max-height:90%;overflow:auto;animation:up .22s ease-out}
@keyframes up{from{transform:translateY(24px);opacity:.4}}
.sheet .grab{width:44px;height:5px;border-radius:9px;background:var(--line);margin:0 auto 14px}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(92px + env(safe-area-inset-bottom,0px));background:var(--rye);color:var(--on-rye);padding:11px 18px;border-radius:14px;font-weight:600;font-size:14px;z-index:60;max-width:90%;text-align:center;box-shadow:var(--shadow)}
#toast[hidden]{display:none}
.empty{text-align:center;padding:22px 14px}
.empty svg{width:180px;height:auto;margin:0 auto 8px;display:block}
.loading{text-align:center;padding:90px 20px;color:var(--muted)}
.loading svg{width:90px;display:block;margin:0 auto 12px;animation:bob 1.6s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-6px)}}
.spec{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:0 0 14px}
.spec div{font-size:12px;color:var(--muted);background:var(--paper);border:1px solid var(--line);border-radius:16px;padding:10px;text-align:center;box-shadow:var(--shadow)}
.spec b{display:block;font-size:17px;color:var(--rye);font-family:'Frank Ruhl Libre',Georgia,serif}
.credit{font-size:13px;font-weight:700;color:var(--crust);margin-top:3px;letter-spacing:.01em}
.seg{display:grid;grid-template-columns:1fr 1fr;background:var(--chip);border-radius:16px;padding:4px;margin:0 0 14px;gap:4px}
.seg button{border:0;background:transparent;font:inherit;font-weight:700;color:var(--muted);padding:10px;border-radius:12px;cursor:pointer;min-height:42px}
.seg button[aria-selected="true"]{background:var(--paper);color:var(--rye);box-shadow:var(--shadow)}
.codebox{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:19px;font-weight:700;letter-spacing:.08em;text-align:center;background:var(--flour);border:1px dashed var(--caramel);border-radius:16px;padding:16px 10px;color:var(--rye);word-break:break-all}
.welcome-list{padding-inline-start:20px;margin:6px 0 0}.welcome-list li{margin-bottom:8px}
table.journal th{color:var(--muted);font-weight:600;font-size:13px;border-bottom:1px dashed var(--line)}
@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}
@media (max-width:380px){.hero{grid-template-columns:100px 1fr}.hero .jarwrap{width:100px}.big{font-size:40px}.ring{width:100px;height:100px}}
</style>
</head>
<body>
<div class="app" id="app"><div class="loading">טוען את היומן…</div></div>
<nav class="tabs" aria-label="ניווט ראשי"><div class="in" id="tabs"></div></nav>
<div id="sheet" hidden></div>
<div id="toast" hidden role="status"></div>

<script src="firebase-config.js"></script>
<script>
(function(){
'use strict';
/* ---------- utils ---------- */
const $=(s,r=document)=>r.querySelector(s);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const now=()=>Date.now();
const pad=n=>String(n).padStart(2,'0');
const r1=x=>Math.round(x*10)/10;
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
function dur(ms){const neg=ms<0;const s=Math.floor(Math.abs(ms)/1000);const H=Math.floor(s/3600),M=Math.floor(s%3600/60),X=s%60;return (neg?'-':'')+(H?H+':'+pad(M):M)+':'+pad(X);}
function hrs(x){if(x==null||!isFinite(x))return '—';if(x<1)return Math.round(x*60)+' דק׳';return r1(x)+' ש׳';}
function mins(m){if(m==null||!isFinite(m))return '—';if(m<60)return Math.round(m)+' דק׳';return r1(m/60)+' ש׳';}
const tFmt=ts=>new Date(ts).toLocaleTimeString('he-IL',{hour:'2-digit',minute:'2-digit'});
const dFmt=ts=>new Date(ts).toLocaleDateString('he-IL',{day:'numeric',month:'short'});
const dtFmt=ts=>dFmt(ts)+', '+tFmt(ts);
function toLocalInput(ts){const off=new Date(ts).getTimezoneOffset()*6e4;return new Date(ts-off).toISOString().slice(0,16);}
function fromLocalInput(v){const t=new Date(v).getTime();return isNaN(t)?now():t;}
function interp(pts,x){if(x<=pts[0][0])return pts[0][1];for(let i=1;i<pts.length;i++){if(x<=pts[i][0]){const[a,b]=pts[i-1],[c,d]=pts[i];return b+(d-b)*(x-a)/(c-a);}}return pts[pts.length-1][1];}
const num=v=>{const n=parseFloat(v);return isFinite(n)?n:null;};
function toast(msg){const t=$('#toast');t.textContent=msg;t.hidden=false;clearTimeout(toast._t);toast._t=setTimeout(()=>{t.hidden=true;},3200);}
function md(t){const lines=esc(t).split('\n');let out='',inL=false;for(let ln of lines){ln=ln.replace(/\*\*(.+?)\*\*/g,'<strong>$1</strong>');const m=ln.match(/^\s*[-*•]\s+(.*)/)||ln.match(/^\s*\d+[.)]\s+(.*)/);if(m){if(!inL){out+='<ul>';inL=true;}out+='<li>'+m[1]+'</li>';continue;}if(inL){out+='</ul>';inL=false;}const hm=ln.match(/^#{1,4}\s+(.*)/);if(hm){out+='<h4>'+hm[1]+'</h4>';continue;}if(ln.trim())out+='<p>'+ln+'</p>';}if(inL)out+='</ul>';return out;}
const stars=n=>'★'.repeat(n||0)+'☆'.repeat(5-(n||0));

/* ---------- data: recipes ---------- */
const g=(x,k)=>Math.round(x*k);
const RECIPES=[
{id:'geller',name:'כיכר הבסיס מהקורס',sub:'המתכון של איתן גלר — כ-700 ג׳ בצק, מתאים ללמידת תחושת הבצק',time:'כ-14 ש׳ ועד 45 ש׳',hyd:73,course:true,
 src:['','חוברת הקורס — מאסטרקלאס לחמי מחמצת, איתן גלר'],

/* ---------- starter model ---------- */
function ratioStr(f){const s=Math.max(+f.starter||1,1);return `1:${r1((+f.flour||0)/s)}:${r1((+f.water||0)/s)}`;}
function basePeak(f){
 const r=(+f.flour||0)/Math.max(+f.starter||1,1);
 const b=interp([[0.5,3.5],[1,4.3],[2,6.5],[3,8],[5,9.5],[10,11.5],[15,14]],r);
 const T=num(f.temp)!=null?num(f.temp):22;
 let h=b*Math.pow(2,(22-T)/5.5);
 const hyd=(+f.water||0)/Math.max(+f.flour||1,1);
 if(hyd<.8)h*=1.15;
 if(f.flourType==='rye'||f.flourType==='whole')h*=.85;
 return Math.min(Math.max(h,1.5),30);
}
function calib(){
 const xs=S.starter.feeds.filter(f=>f.peakAt&&f.state==='peak').slice(-8).map(f=>((f.peakAt-f.at)/36e5)/basePeak(f)).filter(v=>v>.2&&v<4);
 if(xs.length<2)return{k:1,n:xs.length};
 const k=xs.reduce((a,b)=>a+b,0)/xs.length; return{k:Math.min(Math.max(k,.4),2.5),n:xs.length};
}
function predict(f){const c=calib();const p=basePeak(f)*c.k;return{h:p,lo:p*.85,hi:p*1.15,n:c.n};}
function starterState(){
 const F=S.starter.feeds;const f=F[F.length-1];if(!f)return null;
 const e=(now()-f.at)/36e5;
 if(S.starter.settings.fridge)return{f,kind:'fridge',e};
 const p=predict(f);let kind;
 if(f.peakAt)kind=f.state==='collapsed'?'over':f.state==='norise'?'weak':'logged';
 else if(e<p.lo)kind='rising';else if(e<=p.hi)kind='peak';else kind='over';
 return{f,p,e,kind};
}
function feedInsight(f){
 const tips=[];
 if(f.state==='collapsed')tips.push({c:'bad',t:'הסטארטר כבר קרס כשבדקת — השיא היה מוקדם יותר. בפעם הבאה בדוק מוקדם, או האט: יחס גבוה יותר (1:3:3–1:5:5) או מים קרירים.'});
 else if(f.peakAt&&f.state==='peak'){
  const act=(f.peakAt-f.at)/36e5,q=act/basePeak(f);
  if(q<.7)tips.push({c:'',t:`השיא הגיע אחרי ${hrs(act)} — מהר מהטבלה ליחס ולטמפ׳ האלה. אם לא נוח לך, הגדל יחס או קרר את המים.`});
  else if(q>1.5)tips.push({c:'',t:`השיא לקח ${hrs(act)} — איטי מהצפוי. מקום חם יותר (24–27°C), מים פושרים או יחס נמוך יותר.`});
 }
 if(f.state==='norise')tips.push({c:'bad',t:'לא עלה: מקום חם, האכלות "משיא לשיא" ב-1:2:2 ליומיים-שלושה, וסטארטר מעט עבה יותר (100 קמח / 90 מים).'});
 if(f.riseX&&f.riseX<2&&f.state!=='norise')tips.push({c:'',t:'פחות מהכפלה — הסטארטר עדיין לא בשיא כוחו. תן עוד האכלות קבועות לפני אפייה.'});
 if(f.smell==='acetone')tips.push({c:'bad',t:'ריח אצטון = רעב. השאר 10–20 ג׳ והאכל 1:5:5 ליומיים-שלושה.'});
 if(f.smell==='vinegar')tips.push({c:'',t:'ריח חומץ חזק — חומציות גבוהה. יחס של 1:4:4 ומעלה ירכך אותה.'});
 if(f.hooch)tips.push({c:'bad',t:'נוזל על הפנים = רעב. האכל לעיתים קרובות יותר או ביחס גדול יותר.'});
 if(!tips.length&&f.peakAt)tips.push({c:'good',t:'נראה מצוין. השיא הזה נכנס לתחזית האישית שלך.'});
 return tips;
}

function targetRise(T,r){
 let t=interp([[18,88],[21,70],[24,50],[26,36],[27,30],[29,22],[32,20]],T);
 if(r&&r.wholeGrain)t*=.75;
 if(r&&r.enriched)t=Math.max(t,85);
 return Math.round(t);
}
function bakeLessons(b){
 const r=recipeOf(b),L=[],o=b.outcome;if(!o)return L;
 const c=CRUMB.find(x=>x.id===o.crumb);
 if(c&&c.id!=='good')L.push({c:'bad',t:`${c.label}: סיבה סבירה — ${c.cause}. ${c.fix}.`});
 const last=b.readings[b.readings.length-1];
 if(last&&last.temp!=null&&last.pct!=null){
  const tg=targetRise(last.temp,r);
  if(last.pct<tg-12)L.push({c:'bad',t:`המדידה האחרונה בתסיסה: ${Math.round(last.pct)}% מול יעד ${tg}% ב-${last.temp}°C — כנראה עצרת מוקדם.`});
  else if(last.pct>tg+20)L.push({c:'bad',t:`העלייה הגיעה ל-${Math.round(last.pct)}% מול יעד ${tg}% — ייתכן שהתסיסה נמשכה יותר מדי.`});
  else L.push({c:'good',t:`עצרת את התסיסה ב-${Math.round(last.pct)}% — קרוב ליעד ${tg}%.`});
 }else L.push({c:'',t:'בפעם הבאה רשום טמפ׳ בצק ואחוז עלייה — כך יהיה ברור איפה עצרת.'});
 if(o.spring==='weak'&&(!c||c.id==='good'))L.push({c:'',t:'תפיחה חלשה בתנור: חמם את התנור והסיר זמן רב יותר ובדוק שהסטארטר היה בשיא.'});
 if(!o.next)L.push({c:'',t:'כתוב מה תשנה בפעם הבאה — משתנה אחד בכל אפייה, כדי להבין מה באמת שיפר את התוצאה.'});
 if(o.sour==='very')L.push({c:'',t:'חמוץ מאוד: יחס האכלה גבוה יותר ללבן, להשתמש בו צעיר יותר, או התפחה קרה קצרה יותר.'});
 if(o.sour==='mild')L.push({c:'',t:'רוצה יותר חמיצות? התפחה ארוכה יותר במקרר או לבן שהגיע לשיא מאוחר.'});
 return L;
}

const RULES=`אתה מאמן אפיית מחמצת מנוסה שמלווה אופה ביתי. ענה בעברית, קצר, ישיר ומעשי, עם כותרות קצרות (##) ורשימות (-). אל תמציא נתונים — אם חסר מידע, אמור מה כדאי למדוד בפעם הבאה. תן מספרים קונקרטיים (יחסים, טמפ׳, דקות, אחוזים).
ידע בסיס:
- יחסי האכלה ב-22°C: 1:1:1 שיא ב-4–6 ש׳, 1:2:2 ב-6–8 ש׳, 1:5:5 ב-10–14 ש׳. כל ~5.5°C חם יותר חוצה את הזמן בערך בחצי.
- אצטון/נוזל כהה = רעב → האכלות גדולות (1:3:3–1:5:5) ליומיים-שלושה. עולה וקורס מהר = יחס גבוה יותר או מים קרירים. לא מכפיל = סטארטר מעט עבה יותר, קמח חזק, מקום חם.
- יעד עלייה בתסיסה ראשונית לפי טמפ׳ הבצק: 18°C 75–100%, 21°C 65–75%, 24°C כ-50%, 27°C כ-30%, 29°C 20–25%. קמח מלא: להוריד 20–30%. בצק מועשר: כמעט הכפלה.
- תת-התפחה: צפוף/דביק, חורים גדולים למעלה, קריעה בצד. התפחת-יתר: שטוח, מתפשט, חורים קרועים. דביק במרכז עם תפיחה טובה = אפייה קצרה או חיתוך מוקדם (96–99°C בפנים).
- מבחן לחיצה: קופץ מיד = צריך עוד; חוזר לאט עם שקע קל = מוכן; לא חוזר = עבר.`;

function bakeSummary(b){
 const r=recipeOf(b);

  steps:r.steps.map((s,i)=>{const st=b.steps[i]||{};return{step:s.title,minutes:st.startedAt&&st.doneAt?Math.round((st.doneAt-st.startedAt)/6e4):null,note:st.note||undefined};}),
  folds:b.folds.length,

  poke:(b.pokes||[]).map(p=>p.v),notes:b.notes||undefined,outcome:b.outcome||null};
}

async function runAI(key,prompt,onDone){
 if(!SAMPLE){toast('המאמן זמין כשהאפליקציה פתוחה בתוך Claude');return;}
 if(ui.ai[key]&&ui.ai[key].busy)return;
 ui.ai[key]={busy:true,text:''};paintAI(key);
 try{
  const res=await SAMPLE(prompt,{cache:false,onText:({text})=>{ui.ai[key].text=text;paintAI(key);}});
  ui.ai[key]={busy:false,text:res.text};onDone&&onDone(res.text);
 }catch(e){ui.ai[key]={busy:false,text:(e&&e.text)||'',err:errCopy(e&&e.code)};}
 paintAI(key);
}
function aiInner(a,text){if(a&&a.busy&&!a.text)return '<p class="muted think">המאמן חושב…</p>';return (text?md(text):'')+(a&&a.err?`<p class="warn">${esc(a.err)}</p>`:'');}
function aiBlock(key,stored){const a=ui.ai[key];const text=a?a.text:(stored||'');return `<div class="ai" data-ai="${key}" aria-live="polite">${aiInner(a,text)}</div>`;}
function paintAI(key){const el=document.querySelector(`[data-ai="${key}"]`);const a=ui.ai[key];if(el)el.innerHTML=aiInner(a,a.text);}

 return `<svg class="jar" viewBox="0 0 110 160" role="img" aria-label="${esc(label)}">
 <ellipse cx="55" cy="154" rx="40" ry="4" fill="#000" opacity=".08"/>
 <rect x="20" y="6" width="70" height="18" rx="6" fill="#8A5530"/><rect x="20" y="6" width="70" height="6" rx="4" fill="#A86B3C"/>
 <path d="M14 26 h82 v112 q0 12 -12 12 h-58 q-12 0 -12 -12z" fill="var(--glass)" stroke="#CDB594" stroke-width="2"/>
 <clipPath id="jarclip"><path d="M16 28 h78 v110 q0 10 -10 10 h-58 q-10 0 -10 -10z"/></clipPath>
 <g clip-path="url(#jarclip)">${lv>0?`<rect x="0" y="${y}" width="110" height="${160-y}" fill="#E9CF9F"/><path d="M0 ${y+1} q14 -6 28 -2 t27 -1 t27 2 t28 -2 v8 h-110z" fill="#F2DDB5"/><rect x="0" y="${bottom-10}" width="110" height="14" fill="#E4CFA8" opacity=".6"/>${bubbles}`:''}</g>
 <path d="M22 36 v96" stroke="#fff" stroke-width="5" stroke-linecap="round" opacity=".55"/>
 ${lv>0?`<rect x="10" y="${by-3}" width="90" height="6" rx="3" fill="#7A5234"/>`:''}

function jarNow(){
 const st=starterState();if(!st)return jarSVG(0,.3,'צנצנת ריקה');
 const base=.3,f=st.f;
 if(st.kind==='fridge')return jarSVG(base*1.15,base,'סטארטר במקרר');
 const rx=Math.min(f.riseX||(st.kind==='weak'?1.3:2.2),3.2);
 const peakH=Math.max(f.peakAt?(f.peakAt-f.at)/36e5:st.p.h,.25);
 let fr;if(st.e<peakH){const x=st.e/peakH;fr=(1-Math.cos(Math.PI*x))/2;}else fr=Math.max(.2,1-(st.e-peakH)/(peakH*1.5));
 if(st.kind==='weak')fr=Math.min(fr,.5);
 const lv=Math.min(base*(1+(rx-1)*fr),.95);
 return jarSVG(lv,base,`גובה משוער: פי ${r1(lv/base)} מהגומייה`);
}
function peakChart(){

 const bw=(W-pl)/pts.length;
 const bars=pts.map((f,i)=>{const v=(f.peakAt-f.at)/36e5;const h=(H-pb-8)*v/mx;const x=W-(i+1)*bw+3;return `<rect x="${x}" y="${H-pb-h}" width="${bw-6}" height="${h}" rx="3" fill="var(--crust)"><title>${esc(dFmt(f.at))}: ${hrs(v)}, ${ratioStr(f)}</title></rect>`;}).join('');
 const ticks=[0,Math.round(mx/2),Math.round(mx)].map(v=>{const y=H-pb-(H-pb-8)*v/mx;return `<line x1="0" x2="${W-pl}" y1="${y}" y2="${y}" stroke="var(--line)"/><text x="${W-pl+4}" y="${y+4}" font-size="10" fill="var(--muted)">${v}ש׳</text>`;}).join('');

}

function stepBody(b,r,sd,st,i){

   x+=foldBox(b,sd,st,i);
   const FL=b.flavor&&FLAVORS.find(q=>q.id===b.flavor);
   if(FL)x+=`<div class="note small">🌿 בקיפול האחרון / למינציה: פזר <b>${Math.round(flourOf(r)*b.scale*.15)} ג׳ ${esc(FL.n)}</b>. ${esc(FL.tip)}.</div>`;
   const di=ui.doughIssue&&DOUGH_ISSUES[ui.doughIssue];
   x+=`<div><div class="small muted">איך הבצק מרגיש?</div><div class="chips" style="margin-top:6px">${Object.entries(DOUGH_ISSUES).map(([k,v])=>`<button class="chip" data-act="doughIssue" data-v="${k}" aria-pressed="${ui.doughIssue===k}">${v[0]}</button>`).join('')}</div>${di?`<div class="note ${di[2]} small">${di[1]}</div>`:''}</div>`;

  if(sd.type==='bulk'&&r.steps.every(s=>s.type!=='fold'))x+='';
  if(sd.type==='proof')x+=pokeBox(b,i,sd);
  if(sd.type==='levain')x+=`<p class="tiny muted">הסטארטר שלך: ${(()=>{const s=starterState();return s?(s.kind==='peak'||s.kind==='logged'?'בשיא או קרוב אליו':s.kind==='rising'?'עדיין תופח':'כנראה עבר שיא'):'אין האכלה מתועדת';})()}</p>`;
  x+=`<label class="f">הערה לשלב<textarea data-note="${i}" placeholder="מה ראית, הרגשת, שינית">${esc(st.note||'')}</textarea></label>
  <div class="row"><button class="btn primary" data-act="stepDone" data-i="${i}">סיימתי את השלב</button><button class="btn ghost small" data-act="stepStart" data-i="${i}">אפס טיימר</button></div>`;

}
function ringTimer(st,sd){

 return `<div class="ringrow"><svg class="ring" viewBox="0 0 120 120" role="img" aria-label="התקדמות השלב">
  <circle cx="60" cy="60" r="${R}" fill="var(--paper)" stroke="var(--chip)" stroke-width="10"/>
  <circle cx="60" cy="60" r="${R}" fill="none" stroke="${col}" stroke-width="10" stroke-linecap="round" stroke-dasharray="${(Cc*fr).toFixed(1)} ${Cc.toFixed(1)}" transform="rotate(-90 60 60)" style="transform-box:view-box"/>

  <text x="60" y="58" text-anchor="middle" font-family="Frank Ruhl Libre,Georgia,serif" font-size="21" font-weight="700" fill="var(--rye)" data-since="${st.startedAt}" direction="ltr">0:00</text>
  <text x="60" y="78" text-anchor="middle" font-size="10.5" fill="var(--muted)">${over?'מעבר למומלץ':ready?'אפשר להמשיך':'בשלב'}</text></svg>
  <div class="small"><div class="muted tiny">מומלץ</div><b>${mins(mn)}–${mins(mx)}</b>
  <div style="margin-top:8px" class="muted tiny">${!ready?'מינימום בעוד':'מקסימום בעוד'}</div><b dir="ltr" data-until="${st.startedAt+(ready?mx:mn)*6e4}"></b></div></div>`;
}
function foldBox(b,sd,st,i){
 const every=b.foldEvery||sd.folds.every;

 const lastT=fl.length?fl[fl.length-1].at:st.startedAt;

  <div class="row" style="margin-top:10px"><button class="btn accent" data-act="fold" data-i="${i}">ביצעתי קיפול</button>${fl.length?`<button class="btn ghost small" data-act="foldUndo" data-i="${i}">בטל אחרון</button>`:''}

function bowlGauge(pct,tg){

  <path d="M${x0+8} ${yTop+10} v${yBot-yTop-24}" stroke="#fff" stroke-width="4" stroke-linecap="round" opacity=".5"/>
  <rect x="${x0-4}" y="${by-2}" width="${x1-x0+8}" height="5" rx="2.5" fill="#7A5234"/>
  <text x="${x0-10}" y="${by+4}" text-anchor="end" font-size="10" fill="var(--muted)">התחלה</text>
  <line x1="${x0-6}" x2="${x1+6}" y1="${ty}" y2="${ty}" stroke="${near&&!over?'var(--ok)':'var(--rye)'}" stroke-width="2.2" stroke-dasharray="6 4"/>
  <text x="${x1+12}" y="${ty+4}" font-size="11" font-weight="700" fill="var(--rye)">יעד ${tg}%</text>

 </svg>`;

function bulkBox(b,r){

 return `<div class="sub"><h3 style="font-size:17px">מדידת תסיסה</h3>${prog||`<p class="small muted">הזן טמפ׳ בצק כדי לקבל יעד עלייה.</p>`}${T!=null&&T>26?`<div class="note bad small">הבצק ב-${T}°C — מעל 26°C. חום מאיץ תסיסה: קרר 5 דק׳ ובדוק מוקדם יותר.</div>`:''}
 <form data-form="reading" class="stack" style="margin-top:10px">
  <div class="g3"><label class="f">טמפ׳ בצק °C<input name="temp" type="number" step="0.5" inputmode="decimal" value="${T!=null?T:''}"></label>

const POKE={fast:['קופץ מיד','צריך עוד זמן.','bad'],slow:['חוזר לאט, שקע קל','מוכן לאפייה.','good'],stay:['לא חוזר','עבר את השיא — אפה מיד, ואם צריך עצב מחדש ותן 30–60 דק׳.','bad']};

function journalRows(b){

 const feed=S.starter.feeds.filter(f=>f.at<=(lev.startedAt||b.createdAt)+36e5).slice(-1)[0];
 const temps=(b.readings||[]).map(x=>x.temp).filter(x=>x!=null);
 const mixS=st(idx('mix')).startedAt,shapeI=idx('shape'),shapeS=st(shapeI).startedAt;
 const dur=x=>x.startedAt&&x.doneAt?mins((x.doneAt-x.startedAt)/6e4):null;

 ];

}

const BOOK=[
 {n:'02',t:'תכנון — רצף העבודה',h:()=>`<p>לחם מחמצת אפשר להכין בכ-14 ש׳, או לפרוס את התהליך עד כ-45 ש׳. מתכננים לפי שעת האפייה וחוזרים לאחור.</p>${TB(['שלב','טווח זמן'],[['האכלת המחמצת','3–12 ש׳'],['אוטוליזה','20 דק׳ – 3 ש׳'],['לישה, קיפולים והתפחה ראשונה','3–6 ש׳'],['עיצוב ראשוני, מנוחה ועיצוב סופי','כ-30 דק׳'],['התפחה במקרר','6–24 ש׳'],['חימום התנור ואפייה','כשעה וחצי']])}<p><b>לאחור:</b> קובעים שעת אפייה, מפחיתים חימום ואפייה, אחר כך קירור, עיצוב והתפחה ראשונה — וכך יודעים מתי להאכיל ומתי להתחיל. בלשונית אפייה יש מחשבון שעושה את זה.</p><p class="muted">השעון נותן מסגרת; טמפ׳ החדר, חוזק המחמצת ומצב הבצק קובעים את הקצב.</p>`},
 {n:'03',t:'המתכון הבסיסי',h:()=>`<p>כיכר של כ-700 ג׳ בצק, בהידרציה מתונה שמתאימה ללמידת תחושת הבצק.</p>${TB(['מרכיב','כמות'],[['קמח לחם','280 ג׳'],['קמח כפרי','70 ג׳'],['מים','255 מ״ל'],['מחמצת פעילה','90 ג׳'],['מלח','10 ג׳']])}<p><b>ציוד:</b> קערה וכיסוי, משקל דיגיטלי, קלף, סלסילת התפחה (או קערה עם מגבת), נייר אפייה, תער, רשת קירור, סיר או משטח אפייה.</p><p><b>לפני הערבוב:</b> לוודא שהמחמצת פעילה וסמוך לשיא. ביום חם — מים קרים יותר כדי לשלוט בטמפ׳ הבצק.</p>`},
 {n:'04',t:'המחמצת',h:()=>`${TB(['מתי','יחס מחמצת:מים:קמח','זמן משוער'],[['לאותו יום','1:1:1','כ-4 ש׳'],['ללילה / יום עבודה','1:10:10','כ-10–12 ש׳']])}<p><b>סימני שיא:</b> הנפח גדל משמעותית עם בועות רבות בצדדים ובפנים; החלק העליון תפוח או כיפתי, לפני שמתחיל לשקוע; מרקם אוורירי וריח נעים, חמצמץ ועדין.</p><p>בוחרים יחס לפי חלון הזמן, לא לפי הרגל. מחמצת חזקה נותנת תסיסה חזקה וטעם מאוזן; מחמצת שעברה את השיא עדיין עובדת, אבל פחות חזקה וחמוצה יותר.</p>`},
 {n:'05',t:'בניית הבצק',h:()=>`<p><b>1. אוטוליזה:</b> קמחים ומים עד שאין קמח יבש, מכסים וממתינים 20 דק׳ עד 3 ש׳.</p><p><b>2. מחמצת:</b> מוסיפים ולשים בצביטות עד שנטמעת.</p><p><b>3. מלח:</b> מוסיפים וממשיכים עד שהבצק אחיד ומבריק.</p><p><b>טמפרטורה:</b> בזמן הלישה הבצק לא עובר 26°C. ביום חם מקררים כ-5 דק׳ וממשיכים. חום מאיץ תסיסה — טמפרטורה היא חלק מהמתכון.</p>`},
 {n:'06',t:'קיפולים והתפחה ראשונה',h:()=>`${TB(['זמן','פעולה'],[['אחרי הלישה','מנוחה של כ-30 דק׳'],['קיפול 1','קיפול רגיל'],['אחרי 20–40 דק׳','קיפול 2'],['אחרי 20–40 דק׳','קיפול 3 או למינציה'],['אחרי כ-30 דק׳','בדיקה אם נדרש קיפול נוסף']])}<p><b>מה מחפשים:</b> הבצק נעשה יציב, אלסטי ופחות דביק מקיפול לקיפול. עובדים בידיים רטובות בלבד — בלי קמח ובלי שמן. לא רודפים אחרי מספר קיפולים.</p><p>לישה, קיפולים והתפחה ראשונה יחד: בדרך כלל 3–6 ש׳. מתקדמים לפי הבצק.</p>`},
 {n:'07',t:'עיצוב',h:()=>`<p><b>עיצוב ראשוני:</b> בעדינות, עם מעט מתח על הפנים, בלי להוציא את האוויר.</p><p><b>בנץ׳ רסט:</b> כ-15 דק׳. מתפשט מהר — לקצר; מתנגד למתיחה — להאריך.</p><p><b>עיצוב סופי:</b> לצורה הרצויה, ולסלסילה כשהתפר כלפי מעלה.</p><p><b>התפחה סופית:</b> לקמח היטב את הסלסילה, לכסות ולמקרר ל-6–24 ש׳. להוציא רק כשהתנור וכלי האפייה חמים ומוכנים.</p>`},
 {n:'08',t:'אפייה וקירור',h:()=>`<h4>בסיר</h4><p>חימום מקדים עם הסיר כ-45 דק׳ במקסימום או ב-250°C. הופכים על נייר, מקמחים ומעטרים, חורצים — ומעבירים מיד לסיר, עם שתי קוביות קרח בין הנייר לדופן.</p>${TB(['שלב','טמפ׳','זמן'],[['מכסה סגור','250°C','17 דק׳'],['מכסה פתוח','230°C','כ-20 דק׳']])}<h4>על אבן / משטח</h4><p>חימום לפחות 45 דק׳ בחום עליון-תחתון עם תבנית ריקה בתחתית. מכניסים, שופכים כוס מים לתבנית וסוגרים מהר. אחרי 22 דק׳ פותחים לשחרור אדים, מורידים ל-230°C ואופים כ-20 דק׳ נוספות. <b>זהירות:</b> אדים ומתכת לוהטת.</p><h4>הקירור הוא חלק מהאפייה</h4><p>לרשת, ולפחות שעה לפני פריסה. חיתוך מוקדם עלול ליצור מרקם דביק. אחרי הפריסה: בודקים מבנה, אלסטיות ולחות, ומקשרים לחוזק המחמצת, לתסיסה, לעיצוב ולאפייה.</p>`},
 {n:'09',t:'אחוזי אופה',h:()=>`<p>הקמח הוא תמיד 100%, וכל מרכיב אחר מחושב ביחס לקמח — לא למשקל הבצק.</p>${TB(['מרכיב','אחוז','ל-300 ג׳ קמח'],[['קמח','100%','300 ג׳'],['מים','75%','225 מ״ל'],['מחמצת','25%','75 ג׳'],['מלח','3%','9 ג׳'],['תוספות','15%','45 ג׳']])}<p><b>החישוב:</b> משקל הקמח × האחוז = משקל המרכיב.</p><p><b>במתכון הבסיסי:</b> 350 ג׳ קמח; 15% תוספות ≈ 52 ג׳ לכיכר. כשמגדילים או מקטינים, שומרים על אותם אחוזים. כמות המחמצת תלויה גם בכמה זמן יהיה לבצק לתפוח.</p><p><b>הידרציה:</b> בקמח לבן, למתחילים — לא לעבור 73%. ככל שיש יותר קמח מלא, אפשר להעלות מים בהדרגה.</p>${calcBox()}<p class="muted">המספרים עוזרים לתכנן; הבצק מלמד מתי להתקדם.</p>`},
 {n:'10',t:'טעמים וחמאה ביתית',h:()=>`${TB(['טעם','דגש'],FLAVORS.map(f=>[f.n,f.tip]))}<p>מתחילים מכ-15% תוספות ביחס לקמח, ומוסיפים בזמן הלמינציה. תוספות רטובות — לסנן היטב. בלשונית אפייה אפשר לבחור טעם, והכמות מחושבת לבד.</p><h4>חמאה ביתית</h4><p>500 מ״ל שמנת להקצפה 38% נותנים בערך 180–220 ג׳ חמאה. מקציפים שמנת קרה עד שהשומן נפרד מהנוזל; מסננים, סוחטים ושוטפים במים קרים עד שהמים כמעט שקופים; מתבלים במלח ומוסיפים טעמים.</p>`},
 {n:'11',t:'כשמשהו לא מסתדר',h:()=>`${TB(['מה רואים','סיבה אפשרית','מה לבדוק'],[['כיכר שטוחה','תסיסת יתר או עיצוב חלש','קצב ההתפחה והמתח בעיצוב'],['כיכר דחוסה','מחמצת חלשה או תסיסה קצרה','שיא המחמצת וסיום ההתפחה הראשונה'],['בצק נקרע בקיפולים','חסר מנוחה או עבודה אגרסיבית','להאריך מנוחה ולעבוד בעדינות'],['בצק דביק מאוד','חום גבוה או הידרציה גבוהה','טמפ׳, מים וקמח — לא להוסיף שמן'],['נפתח מהצד','חריצה לא מספקת או קרום מוקדם','חריצה, אדים וחימום מקדים'],['קראמב דביק','פריסה מוקדמת או אפייה חסרה','להמתין שעה ולוודא השחמה מלאה']])}<h4>ארבעת המשתנים הראשונים לבדיקה</h4><ul><li>חוזק המחמצת בתחילת הלישה</li><li>טמפ׳ הבצק והחדר</li><li>משך ההתפחה הראשונה והסופית</li><li>חוזק העיצוב, החימום המקדים והאדים</li></ul><p><b>שנו משתנה אחד בכל אפייה</b> — כך מבינים מה באמת שיפר את התוצאה. תוצאה טובה מתחילה באבחון רגוע ומדויק.</p>`},
 {n:'12',t:'יומן האפייה',h:()=>`<p>בחוברת זה דף למילוי ידני. באפליקציה הוא מתמלא לבד: בסוף כל אפייה מופיע יומן עם תאריך ושעה, יחס ושעת ההאכלה, קמחים והידרציה, טמפ׳ הבצק, קיפולים, משך ההתפחה, עיצוב וקירור ושיטת האפייה. אתה מוסיף רק מה עבד, מה שינית ומה תשנה בפעם הבאה.</p><p>בפעם הבאה שתאפה את אותו מתכון, מה שכתבת ב"מה אשנה בפעם הבאה" יופיע בראש המסך.</p>`}
];
function vKnow(){
 const tab=ui.knowTab||'book';
 const seg=`<div class="seg" role="tablist"><button role="tab" data-act="knowTab" data-v="book" aria-selected="${tab==='book'}">חוברת הקורס</button><button role="tab" data-act="knowTab" data-v="gen" aria-selected="${tab==='gen'}">ידע כללי</button></div>`;
 if(tab==='book')return seg+`<div class="panel warm" style="text-align:center"><div class="tiny muted">מאסטרקלאס לחמי מחמצת</div><h3 style="font-size:22px;margin:4px 0">איתן גלר</h3><p class="small muted" style="margin:0">סיכום החוברת. העקרונות שלה כבר מובנים במתכון הבסיס, בזמנים, באבחון וביומן.</p></div>`+
  BOOK.map(k=>`<details><summary><span class="ico num" aria-hidden="true" style="font-size:13px;font-weight:700;color:var(--crust)">${k.n}</span><span>${esc(k.t)}</span></summary><div class="in small">${k.h()}</div></details>`).join('');
 const KI=['🫙','⚖️','🌡️','❄️','🔍','📈','🧪','👆','🍞','🔥'];
 return seg+KNOW.map((k,i)=>`<details><summary><span class="ico" aria-hidden="true">${KI[i]||'•'}</span><span>${esc(k.t)}</span></summary><div class="in small">${k.h}</div></details>`).join('')+
 `<h2>מקורות</h2><ul class="small" style="padding-inline-start:18px">${SOURCES.map(s=>`<li><a href="${s[0]}" target="_blank" rel="noopener">${esc(s[1])}</a></li>`).join('')}</ul>`;
}

function bulkMinutes(b){const r=recipeOf(b);let m=0;r.steps.forEach((sd,i)=>{const st=b.steps[i]||{};if((sd.type==='fold'||sd.type==='bulk')&&st.startedAt&&st.doneAt)m+=(st.doneAt-st.startedAt)/6e4;});return m||null;}
function lastPct(b){const R=b.readings||[];for(let i=R.length-1;i>=0;i--)if(R[i].pct!=null)return R[i];return null;}
function vCoach(){
 const B=Object.values(S.bakes).filter(b=>b.outcome).sort((a,b)=>b.createdAt-a.createdAt);
 const F=S.starter.feeds.filter(f=>f.peakAt&&f.state==='peak');
 const avg=a=>a.length?a.reduce((x,y)=>x+y,0)/a.length:null;
 const avgR=B.length?r1(avg(B.map(b=>b.outcome.rating))):null;
 const under=B.filter(b=>['dense','fools','blowout'].includes(b.outcome.crumb)).length;
 const over=B.filter(b=>['flat','holey'].includes(b.outcome.crumb)).length;
 const avgPeak=F.length?avg(F.map(f=>(f.peakAt-f.at)/36e5)):null;
 const pattern=B.length>=2?(under>over&&under>=2?'נטייה לתת-התפחה: רוב האפיות החלשות שלך צפופות. תן לתסיסה עוד זמן והגע ליעד העלייה.':over>under&&over>=2?'נטייה להתפחת-יתר: האפיות החלשות שטוחות או עם חורים קרועים. עצור מוקדם יותר או קרר.':''):'';
 const good=B.filter(b=>b.outcome.rating>=4),weak=B.filter(b=>b.outcome.rating<=2);
 const cmp=(arr)=>{const p=arr.map(lastPct).filter(Boolean);return{pct:avg(p.map(x=>x.pct)),temp:avg(p.map(x=>x.temp).filter(x=>x!=null)),bulk:avg(arr.map(bulkMinutes).filter(Boolean))};};
 let cmpHtml='';
 if(good.length&&weak.length){const a=cmp(good),c=cmp(weak);const cell=(v,f)=>v!=null?f(v):'—';
  cmpHtml=`<h3 style="margin-top:14px">טובות מול חלשות</h3><div class="tbl"><table><thead><tr><th></th><th>טובות (4–5★)</th><th>חלשות (1–2★)</th></tr></thead><tbody>
  <tr><td>עלייה בסוף התסיסה</td><td>${cell(a.pct,v=>Math.round(v)+'%')}</td><td>${cell(c.pct,v=>Math.round(v)+'%')}</td></tr>
  <tr><td>טמפ׳ בצק</td><td>${cell(a.temp,v=>r1(v)+'°C')}</td><td>${cell(c.temp,v=>r1(v)+'°C')}</td></tr>
  <tr><td>זמן קיפולים + תסיסה</td><td>${cell(a.bulk,mins)}</td><td>${cell(c.bulk,mins)}</td></tr></tbody></table></div>`;}
 const best=B.slice().sort((a,b)=>b.outcome.rating-a.outcome.rating||b.createdAt-a.createdAt)[0];
 let bestHtml='';
 if(best){const lp=lastPct(best);bestHtml=`<h3 style="margin-top:14px">האפייה הכי טובה שלך</h3><p class="small"><b>${esc(best.name)}</b> (${esc(dFmt(best.createdAt))}) <span class="stars">${stars(best.outcome.rating)}</span><br>${[lp&&lp.temp!=null?'בצק '+lp.temp+'°C':null,lp?'עצרת ב-'+Math.round(lp.pct)+'%':null,bulkMinutes(best)?'תסיסה '+mins(bulkMinutes(best)):null].filter(Boolean).join(' · ')||'אין מדידות'}</p>`;}
 const perR=RECIPES.map(r=>{const x=B.filter(b=>b.recipeId===r.id);return x.length?`<tr><td>${esc(r.name)}</td><td>${x.length}</td><td>${r1(avg(x.map(b=>b.outcome.rating)))}</td></tr>`:'';}).join('');
 return `<div class="g3" style="margin-bottom:14px">
  <div class="stat"><div class="mid">${B.length}</div><div class="tiny muted">אפיות מסוכמות</div></div>
  <div class="stat"><div class="mid">${avgR!=null?avgR:'—'}</div><div class="tiny muted">דירוג ממוצע</div></div>
  <div class="stat"><div class="mid">${avgPeak!=null?hrs(avgPeak):'—'}</div><div class="tiny muted">ממוצע עד שיא</div></div></div>
  <section class="panel">
  ${pattern?`<div class="note bad small" style="margin-top:12px">${esc(pattern)}</div>`:''}
  ${!B.length?'<p class="small muted" style="margin-top:12px">סכם כמה אפיות, והתובנות יופיעו כאן.</p>':''}
  ${cmpHtml}${bestHtml}
  ${perR?`<h3 style="margin-top:14px">לפי מתכון</h3><div class="tbl"><table><thead><tr><th>מתכון</th><th>אפיות</th><th>דירוג</th></tr></thead><tbody>${perR}</tbody></table></div>`:''}</section>
 <h2>היומן שלי</h2>
 ${Store.mode==='cloud'?`<section class="panel"><p class="small">היומן מסונכרן לענן ונפתח אוטומטית בטלפון הזה — בלי שם משתמש ובלי סיסמה.</p>
  <div class="row"><button class="btn small primary" data-act="showCode">הצג קוד יומן</button><button class="btn small" data-act="shareLink">קישור למכשיר נוסף</button><button class="btn small ghost" data-act="switchJournal">חבר יומן אחר</button></div>
  ${ui.switching?`<form data-form="join" class="stack" style="margin-top:12px"><label class="f">קוד יומן<input name="code" dir="ltr" autocomplete="off" autocapitalize="characters" spellcheck="false" placeholder="XXXXX-XXXXX-XXXXX-XXXXX" style="font-family:ui-monospace,Menlo,monospace;text-align:center"></label><div class="warn small" role="alert"></div><button class="btn small" type="submit">חבר</button></form>`:''}</section>`
 :`<section class="panel"><p class="small muted">${Store.err==='anon'?'הסנכרון כבוי: צריך להפעיל Anonymous ב-Firebase Authentication.':'היומן שמור רק במכשיר הזה.'} גבה מדי פעם לקובץ.</p></section>`}
 <section class="panel"><h3>גיבוי לקובץ</h3>
  <div class="row"><button class="btn small" data-act="exportData">ייצוא</button><label class="btn small ghost">ייבוא<input type="file" accept="application/json,.json" data-import="1" hidden></label></div></section>`;
}

/* ---------- render ---------- */
function render(){
 const app=$('#app');
 $('#tabs').innerHTML=TABS.map(([id,l])=>`<button data-act="tab" data-id="${id}" ${ui.tab===id?'aria-current="page"':''}><svg viewBox="0 0 24 24" aria-hidden="true">${ICON[id]}</svg>${l}</button>`).join('');
 if(!READY){app.innerHTML=`<div class="loading">${LOGO}טוען את היומן…</div>`;return;}
 if(ui.welcome){$('#tabs').innerHTML='';app.innerHTML=vWelcome();return;}
 let body='';
 if(ui.tab==='starter')body=vStarter();
 else if(ui.tab==='bake'){const b=ui.bakeId&&S.bakes[ui.bakeId];body=b?vBake(b):vBakeList();}
 else if(ui.tab==='recipes')body=vRecipes();
 else if(ui.tab==='know')body=vKnow();
 else body=vCoach();
 app.innerHTML=vHeader()+body;
 tickTimers();updCalc();
}
function tickTimers(){
 const t=now();
 document.querySelectorAll('[data-since]').forEach(el=>{el.textContent=dur(t-+el.dataset.since);});

const FORMS={
 async join(f){
  const code=normCode(f.code.value);const err=f.querySelector('.warn');const btn=f.querySelector('button[type=submit]');
  if(code.length!==20){err.textContent='הקוד צריך להכיל 20 תווים.';return;}
  if(!Store.fb){err.textContent='אין חיבור לענן כרגע.';return;}
  btn.disabled=true;err.textContent='';
  try{
   if(!(await Store.exists(code))){err.textContent='לא נמצא יומן עם הקוד הזה. בדוק שהקלדת נכון.';btn.disabled=false;return;}
   if(Store.code&&Store.code!==code&&!confirm('להחליף את היומן בטלפון הזה ביומן של הקוד?')){btn.disabled=false;return;}
   Store.setCode(code);await Store.loadAll();ui.welcome=false;ui.joinMode=false;ui.switching=false;ui.joinPrefill=null;render();toast('היומן חובר');
  }catch(e){console.error(e);err.textContent='לא הצלחתי להתחבר. בדוק חיבור לאינטרנט.';btn.disabled=false;}
 },
 feed(f){
  const x=feedFromForm(f);if(!x.starter||!x.flour){toast('מלא כמויות סטארטר וקמח');return;}
  const feed=Object.assign(x,{id:uid(),at:fromLocalInput(f.at.value),notes:f.notes.value.trim()||undefined,flourTypeLabel:FLOUR_LABEL[x.flourType]});
  S.starter.feeds.push(feed);S.starter.feeds.sort((a,b)=>a.at-b.at);
  if(S.starter.settings.fridge===true&&false)S.starter.settings.fridge=false;
  saveStarter();closeSheet();render();toast('ההאכלה נשמרה');
 },
 peak(f){
  const F=S.starter.feeds;const l=F[F.length-1];if(!l){closeSheet();return;}
  l.state=f.state.value;l.peakAt=fromLocalInput(f.at.value);l.riseX=num(f.rise.value)||undefined;l.smell=f.smell.value||undefined;l.smellLabel=SMELL_LABEL[l.smell];l.hooch=f.hooch.checked||undefined;
  if(f.notes.value.trim())l.notes=((l.notes?l.notes+' · ':'')+f.notes.value.trim());

  saveStarter();closeSheet();render();window.scrollTo(0,0);
 },
 newBake(f){
  const r=RECIPES.find(x=>x.id===f.recipe.value);const scale=+f.scale.value||1;
  const id='b_'+uid();
  const fl=f.flavor&&f.flavor.value!=='none'?f.flavor.value:undefined;const fn=fl?FLAVORS.find(x=>x.id===fl).n:'';
  const b={id,recipeId:r.id,name:f.name.value.trim()||(fn?r.name+' · '+fn:r.name),scale,flavor:fl,createdAt:now(),steps:r.steps.map(()=>({})),folds:[],readings:[],pokes:[]};
  b.steps[0].startedAt=now();
  saveBake(b);closeSheet();ui.tab='bake';ui.bakeId=id;ui.recipeId=null;render();window.scrollTo(0,0);
 },
 reading(f){
  const b=curBake();const temp=num(f.temp.value),start=num(f.start.value),cur=num(f.cur.value),eye=num(f.eye.value);
  let pct=null;if(start&&cur!=null)pct=(cur-start)/start*100;else if(eye!=null)pct=eye;

  if(start)b.aliquotStart=start;
  b.readings.push({at:now(),temp:temp!=null?temp:(b.readings.length?b.readings[b.readings.length-1].temp:null),pct});

 },

  const b=curBake();

  b.outcome={rating:+(f.querySelector('input[name=rating]:checked')||{value:3}).value,crumb:f.crumb.value,method:f.method.value,spring:f.spring.value,sour:f.sour.value,changed:tv(f.changed),worked:tv(f.worked),next:tv(f.next),notes:tv(f.notes),at:now()};
  delete b.forceOutcome;delete b.draftOutcome;saveBake(b);render();

 },

 chat(f){

  const intro=`${RULES}\n\nההיסטוריה שלי לעיון (JSON):\n${historyJSON()}\n\nמעכשיו ענה על השאלות שלי, עד 180 מילים לתשובה.`;
  const turns=[{role:'user',content:intro},{role:'assistant',content:'הבנתי. מה השאלה?'},...ui.chat];
  render();
  if(!SAMPLE)return;
  ui.ai.chat={busy:true,text:''};paintAI('chat');

   .catch(e=>{ui.chat.pop();ui.ai.chat={busy:false,text:'',err:errCopy(e&&e.code)};paintAI('chat');});
 }
};
